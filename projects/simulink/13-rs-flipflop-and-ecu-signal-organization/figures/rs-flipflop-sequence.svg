<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#f7f9fc"/><text x="45" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#17365d">RS 触发器：置位、保持与复位（教学序列）</text><text x="45" y="82" font-family="Arial,sans-serif" font-size="16" fill="#53657a">假设 S、R 高电平有效；S=R=0 时保持上一状态</text><g stroke="#d4dce7"><path d="M150 130H940M150 230H940M150 330H940"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#26384a"><text x="40" y="165">S</text><text x="40" y="265">R</text><text x="40" y="365">Q</text></g><path d="M150 180H250V125H350V180H940" fill="none" stroke="#1677d2" stroke-width="6"/><path d="M150 280H750V225H850V280H940" fill="none" stroke="#e08a24" stroke-width="6"/><path d="M150 380H250V325H750V380H940" fill="none" stroke="#23945f" stroke-width="6"/><g stroke="#34495e" stroke-dasharray="6 6"><path d="M250 110V390M350 110V390M750 110V390M850 110V390"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#26384a"><text x="245" y="415">1 s</text><text x="345" y="415">2 s</text><text x="745" y="415">6 s</text><text x="845" y="415">7 s</text></g><g font-family="Arial,sans-serif" font-size="18" font-weight="bold"><text x="390" y="150" fill="#1677d2">S 置位，Q=1</text><text x="450" y="310" fill="#23945f">S 释放后，Q 保持为 1</text><text x="760" y="205" fill="#b36a12">R 复位，Q=0</text></g></svg>